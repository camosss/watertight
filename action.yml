name: watertight-receipts
description: Fail the build when a report contains ungrounded numbers — every figure must carry its receipt.
branding:
  icon: droplet
  color: blue
inputs:
  path:
    description: Directory to search for report.md files (each must sit next to its metrics.json)
    required: false
    default: '.'
  max-age:
    description: Also fail metrics whose fetched_at is older than this many days
    required: false
    default: ''
  version:
    description: watertight version to run
    required: false
    default: 'latest'
runs:
  using: composite
  steps:
    - name: Check every report
      shell: bash
      env:
        WT_PATH: ${{ inputs.path }}
        WT_MAX_AGE: ${{ inputs.max-age }}
        WT_VERSION: ${{ inputs.version }}
      run: |
        set -u
        npm install --global --no-fund --no-audit "watertight@${WT_VERSION}"
        max_age=()
        [ -n "$WT_MAX_AGE" ] && max_age=(--max-age "$WT_MAX_AGE")
        status=0
        found=0
        while IFS= read -r -d '' report; do
          found=1
          dir=$(dirname "$report")
          echo "── $dir"
          watertight "$dir" --check "${max_age[@]}" || status=1
        done < <(find "$WT_PATH" -name report.md -not -path '*/node_modules/*' -print0)
        if [ "$found" -eq 0 ]; then
          echo "::error::no report.md found under $WT_PATH — nothing checked is not a pass"
          exit 2
        fi
        exit $status
